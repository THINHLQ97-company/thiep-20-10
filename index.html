<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<link rel="icon" href="assets/app-icon.png">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<title>Hai Đứa Mình</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Itim&display=swap">
<style>
/* Bố cục: một cột kiểu ứng dụng điện thoại (tối đa 520px), thanh điều hướng dưới đáy, nút "+" ở giữa để thêm ảnh.
   Màu kẹo ngọt: hồng, đào, bơ, bạc hà, xanh trời, tím nhạt trên nền giấy kem. Một thế giới sáng cố định, không đổi theo dark mode. */
:root{
  --paper:#fff8f1; --card:#ffffff; --ink:#3d2b4f; --ink-soft:#7a6589; --line:#f1dfe7;
  --pink:#ff6f9f; --pink-soft:#ffd5e3; --peach:#ffb59c; --butter:#ffe08a; --mint:#8fe0c0; --sky:#9fd2ff; --lilac:#c4b2ff;
  --display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Itim","Comic Sans MS",cursive;
  --ease:cubic-bezier(.3,1.4,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.5;
  background:radial-gradient(circle at 12% 8%,#ffe3ee 0 18%,transparent 40%),radial-gradient(circle at 92% 30%,#e5f6ff 0 16%,transparent 38%),
  radial-gradient(circle at 20% 90%,#e9fff4 0 18%,transparent 40%),var(--paper);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(#f3c9d8 1.2px,transparent 1.3px);background-size:22px 22px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
svg{display:block}
.app{position:relative;max-width:520px;margin:0 auto;min-height:100%;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--ink-soft)}

/* ---------- thanh trên ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--pink);text-decoration:none}
.brand i{width:30px;height:30px;border-radius:10px;background:var(--pink);display:grid;place-items:center;transform:rotate(-8deg);box-shadow:0 3px 0 #e04f83}
.me{display:flex;align-items:center;gap:8px;border:0;text-decoration:none;color:var(--ink);background:#fff;border-radius:99px;padding:4px 12px 4px 4px;box-shadow:0 3px 0 var(--line)}
.me img,.me span.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--pink-soft);display:grid;place-items:center;font-weight:700;font-size:13px}
.me b{font-size:14px}

/* ---------- thẻ chung ---------- */
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 6px 0 var(--line),0 14px 30px #c9809d1a}
.section{display:grid;gap:12px;margin-top:22px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-h h2{font-size:22px}
.section-h a{font-size:14px;font-weight:600;color:var(--pink);text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;text-decoration:none;border-radius:99px;padding:12px 20px;font-weight:700;
  background:var(--pink);color:#fff;box-shadow:0 4px 0 #d94b7f;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d94b7f}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}

/* ---------- màn hình đăng nhập ---------- */
.login{min-height:calc(100svh - 140px);display:grid;align-content:center;justify-items:center;gap:18px;text-align:center}
.login h1{font-size:clamp(40px,12vw,58px);color:var(--pink);text-shadow:0 4px 0 #ffd0df}
.login p{margin:0;max-width:30ch}
.fb{background:#1877f2;box-shadow:0 4px 0 #0d5bc4;font-size:17px;padding:14px 24px}
.fb:active{box-shadow:0 1px 0 #0d5bc4}
.lock-note{font-size:13px;display:flex;align-items:center;gap:6px}
.alt-login{border:0;background:none;padding:6px 10px;font-weight:600;font-size:14.5px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.code-input{letter-spacing:.4em;text-align:center;font-family:var(--display);font-size:26px!important}
.book3d{position:relative;width:min(86vw,320px);height:250px;perspective:1100px;margin-top:6px}
.book{position:absolute;left:50%;top:50%;width:280px;height:190px;margin:-95px 0 0 -140px;transform-style:preserve-3d;transform:rotateX(26deg) rotateZ(-5deg);animation:bookfloat 6s ease-in-out infinite}
@keyframes bookfloat{50%{transform:rotateX(22deg) rotateZ(-3deg) translateY(-8px)}}
.book .base{position:absolute;inset:0;border-radius:10px;background:var(--pink);box-shadow:0 26px 30px -12px #b7487466;transform:translateZ(-6px)}
.book .pg{position:absolute;top:6px;bottom:6px;width:calc(50% - 6px);background:#fffaf4;box-shadow:inset 0 0 0 1px #f3e2d8}
.book .pg.l{left:6px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,#fffaf4 85%,#f2e3da)}
.book .pg.r{right:6px;border-radius:0 6px 6px 0;background:linear-gradient(270deg,#fffaf4 85%,#f2e3da)}
.book .pg i{position:absolute;left:14px;right:14px;height:3px;border-radius:2px;background:#f6dce6}
.book .leaf{position:absolute;top:6px;bottom:6px;left:50%;width:calc(50% - 6px);transform-origin:0 50%;transform-style:preserve-3d;animation:leaf 12s ease-in-out infinite;animation-delay:calc(var(--i) * 2s)}
.book .leaf > div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;align-content:center;gap:6px;
  background:#fffaf4;color:var(--a);font-family:var(--hand);font-size:16px;border-radius:0 6px 6px 0;box-shadow:inset 0 0 0 1px #f3e2d8}
.book .leaf > div svg{width:54px;height:54px}
.book .leaf .bk{transform:rotateY(180deg);border-radius:6px 0 0 6px}
.book .leaf .bk span{width:62%;display:grid;gap:8px}.book .leaf .bk span i{height:3px;border-radius:2px;background:var(--b)}
@keyframes leaf{0%{transform:rotateY(0) translateZ(1px);visibility:visible}14%{transform:rotateY(-180deg) translateZ(1px)}84%{transform:rotateY(-180deg);visibility:visible}
  85%{transform:rotateY(-180deg);visibility:hidden}86%{transform:rotateY(0);visibility:hidden}100%{transform:rotateY(0);visibility:visible}}
.book .ribbon-b{position:absolute;left:58%;top:-2px;width:12px;height:150px;background:var(--butter);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);transform:translateZ(3px)}
.book3d .spark{position:absolute;width:20px;height:20px;color:var(--pink);opacity:0;animation:rise 5s ease-in infinite;pointer-events:none}
.book3d .spark:nth-child(even){color:var(--peach)}
.cover{position:relative;width:min(84vw,340px);perspective:1000px;margin-top:4px}
.cover .pola{--rot:-3deg;padding:10px 10px 14px;animation:floaty 5s ease-in-out infinite}
.cover .pola .ph{aspect-ratio:1312/1199}
.cover .pola figcaption{font-size:21px;text-align:center;padding-top:10px}
.cover .pola .tape{width:96px;margin-left:-48px;height:26px;top:-12px}
@keyframes floaty{50%{translate:0 -8px}}
.cover .hrt{position:absolute;width:22px;height:22px;color:var(--pink);opacity:0;animation:rise 4.5s ease-in infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.9}100%{transform:translateY(-140px) scale(1.15);opacity:0}}
.origin{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s var(--ease)}
.origin b{display:block;font-family:var(--display);font-size:20px;line-height:1.15}
.origin small{display:block;font-size:14px;margin-top:4px}
.origin .go{display:inline-block;margin-top:8px;font-weight:700;font-size:14px;color:var(--pink)}
.env3d{position:relative;flex:none;width:112px;height:80px;perspective:500px}
.env3d::before{content:"";position:absolute;inset:0;border-radius:8px;background:#ffc9b3}
.env3d .paper{position:absolute;left:9px;right:9px;top:6px;height:66px;z-index:1;border-radius:4px;background:#fff;padding:10px 9px;display:grid;gap:6px;align-content:start;animation:peek 6s ease-in-out infinite}
.env3d .paper i{display:block;height:3px;border-radius:2px;background:#ffd5e3}
.env3d .paper i:nth-child(2){width:80%}.env3d .paper i:nth-child(3){width:60%}
.env3d .pocket{position:absolute;inset:0;z-index:2;border-radius:8px;background:#fff1e6;clip-path:polygon(0 32%,50% 70%,100% 32%,100% 100%,0 100%)}
.env3d .flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:3;background:#ffb999;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;animation:flap 6s ease-in-out infinite}
.env3d .seal{position:absolute;left:50%;top:44%;z-index:4;width:24px;height:24px;margin:-12px 0 0 -12px;color:var(--pink);animation:seal 6s ease-in-out infinite}
@keyframes flap{0%,12%{transform:rotateX(0);z-index:3}24%,78%{transform:rotateX(180deg);z-index:0}90%,100%{transform:rotateX(0);z-index:3}}
@keyframes peek{0%,26%{transform:translateY(0)}40%,68%{transform:translateY(-30px)}80%,100%{transform:translateY(0)}}
@keyframes seal{0%,10%{opacity:1;transform:scale(1)}18%,84%{opacity:0;transform:scale(.4)}92%,100%{opacity:1;transform:scale(1)}}
.pin-letter{display:block;text-decoration:none;color:inherit}
.pin-letter .ribbon{position:absolute;left:-6px;top:14px;z-index:2;background:var(--pink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:0 99px 99px 0;box-shadow:0 2px 0 #d94b7f}
.clock{position:relative;margin-top:16px;border-radius:28px;padding:20px 18px 18px;color:#fff;overflow:hidden;
  background:radial-gradient(120% 90% at 0% 0%,#ffb59c 0,transparent 55%),radial-gradient(120% 90% at 100% 100%,#c4b2ff 0,transparent 55%),linear-gradient(135deg,#ff8db3,#ff6f9f);
  box-shadow:0 7px 0 #e0588b,0 18px 34px #ff6f9f40}
.clock::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff40 1.2px,transparent 1.3px);background-size:18px 18px;opacity:.6}
.clock > *{position:relative;z-index:1}
.clock .lbl{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
.clock .days{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.clock .days b{font-family:var(--display);font-size:clamp(56px,17vw,76px);line-height:1;text-shadow:0 4px 0 #d94b7f;font-variant-numeric:tabular-nums}
.clock .days span{font-family:var(--display);font-size:24px}
.clock .ticks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;perspective:500px}
.clock .tick{background:#ffffff2b;border:1.5px solid #ffffff55;border-radius:16px;padding:8px 4px 6px;text-align:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.clock .tick b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.clock .tick b.flip{animation:flipnum .5s var(--ease)}
@keyframes flipnum{0%{transform:rotateX(-90deg);opacity:.2}100%{transform:none;opacity:1}}
.clock .tick small{font-size:11.5px;font-weight:600;opacity:.9}
.clock .since{margin:12px 0 0;font-size:13.5px;opacity:.95}
.clock .heartbeat{position:absolute;right:16px;top:14px;width:46px;height:46px;color:#fff;animation:beat 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 0 #d94b7f)}
.clock .next{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:#fff;color:#d4447a;font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px}
.mtl{position:relative;display:grid;gap:12px;padding-left:28px}
.mtl::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--peach),var(--pink),var(--lilac))}
.ms{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--line);text-decoration:none;color:inherit}
.ms::before{content:"";position:absolute;left:-23px;top:50%;width:13px;height:13px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid var(--pink)}
.ms .mi{width:40px;height:40px;flex:none;border-radius:13px;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center}
.ms .mi svg{width:24px;height:24px}
.ms b{display:block;font-size:15px;line-height:1.3}
.ms small{font-size:12.5px;color:var(--ink-soft)}
.ms.main{background:linear-gradient(135deg,#fff0f5,#fff);box-shadow:0 4px 0 #ffc2d6}
.ms.main::before{background:var(--pink)}
.ms.main .mi{background:var(--pink);color:#fff}
.bdays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bday{position:relative;background:#fff;border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--line);display:grid;gap:2px;overflow:hidden}
.bday .cake{position:absolute;right:-6px;bottom:-8px;width:62px;height:62px;color:var(--b);opacity:.9}
.bday b{font-family:var(--display);font-size:17px}
.bday .left{font-family:var(--display);font-size:28px;line-height:1.1;color:var(--a)}
.bday small{font-size:12.5px;color:var(--ink-soft)}
.bday.today{background:linear-gradient(135deg,var(--b),#fff)}
.banner{margin-top:14px;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--line),0 14px 30px #c9809d1a}
.banner img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:50% 30%}

/* ---------- vòng xoay 3D ---------- */
.stage3d{position:relative;height:280px;perspective:900px;perspective-origin:50% 30%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ring{position:absolute;left:50%;top:44%;width:0;height:0;transform-style:preserve-3d}
.ring > .slot{position:absolute;left:-62px;top:-80px;width:124px;transform-style:preserve-3d}
.ring > .slot > *{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:flat}
.ring .pola .stk{transform:rotate(12deg)}
.stage3d .floor{position:absolute;left:50%;bottom:6px;width:300px;height:60px;margin-left:-150px;border-radius:50%;background:radial-gradient(closest-side,#e7a9c066,transparent)}
.heart3d{position:absolute;left:50%;top:44%;width:56px;height:56px;margin:-28px 0 0 -28px;transform-style:preserve-3d;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}

/* ---------- polaroid ---------- */
.pola{position:relative;margin:0;background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:0 8px 18px #7a3a5a26,0 2px 0 #f2e4ea;
  transform:rotate(var(--rot,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .35s var(--ease)}
.pola .ph{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;background:var(--b,#ffe9f1)}
.pola .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pola .ph .ph-empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--a);font-size:13px;font-weight:600;text-align:center;padding:10px}
.pola .ph .ph-empty svg{width:42px;height:42px}
.pola figcaption{font-family:var(--hand);font-size:15px;line-height:1.25;padding:8px 4px 0;display:grid;gap:2px}
.pola figcaption time{font-family:var(--body);font-size:11px;color:var(--ink-soft)}
.pola .tape{position:absolute;left:50%;top:-10px;width:70px;height:22px;margin-left:-35px;transform:rotate(-4deg);background:var(--a);opacity:.55;border-radius:3px}
.pola .stk{position:absolute;right:-12px;bottom:28px;width:40px;height:40px;border-radius:50%;background:var(--b);display:grid;place-items:center;
  box-shadow:0 3px 0 #0000001a;transform:rotate(12deg) translateZ(20px);color:var(--a)}
.pola .stk svg{width:24px;height:24px}
.pola.mini{padding:6px 6px 8px}
.pola.mini figcaption{font-size:12.5px;padding-top:5px}
.pola.mini .stk{width:30px;height:30px;right:-8px;bottom:20px}.pola.mini .stk svg{width:18px;height:18px}
.pola.mini .tape{width:46px;height:16px;margin-left:-23px;top:-7px}

/* dải photobooth */
.strip{width:min(100%,220px);background:#2b1d36;padding:10px 10px 14px;border-radius:6px;display:grid;gap:8px;box-shadow:0 10px 20px #3d2b4f33;transform:rotate(var(--rot,0deg))}
.strip .ph{aspect-ratio:4/3;border-radius:2px;overflow:hidden;background:#3b2a4a}
.strip .ph img{width:100%;height:100%;object-fit:cover;display:block}
.strip .lbl{font-family:var(--display);font-weight:800;color:#ffd5e3;text-align:center;font-size:13px;letter-spacing:.2em}
/* khung phim */
.film{background:#1e1626;padding:16px 8px;border-radius:4px;position:relative;box-shadow:0 10px 20px #3d2b4f33;transform:rotate(var(--rot,0deg))}
.film::before,.film::after{content:"";position:absolute;left:8px;right:8px;height:8px;background:repeating-linear-gradient(90deg,#fff8 0 8px,transparent 8px 16px)}
.film::before{top:4px}.film::after{bottom:4px}
.film .ph{aspect-ratio:3/2;overflow:hidden;border-radius:2px}
.film .ph img{width:100%;height:100%;object-fit:cover;display:block}
.film figcaption{color:#fff;font-family:var(--hand);font-size:14px;padding:6px 4px 0;display:flex;justify-content:space-between;gap:8px}
.film figcaption time{font-family:var(--body);font-size:11px;opacity:.7}

/* ---------- màu chủ đề ---------- */
.t-heart{--a:#ff6f9f;--b:#ffe0eb}.t-cook{--a:#f0a020;--b:#fff1c9}.t-beach{--a:#2aa6d8;--b:#dff4ff}.t-dunes{--a:#e08a4a;--b:#ffe9d6}
.t-lotus{--a:#e0609a;--b:#ffe3f0}.t-pine{--a:#3fa877;--b:#ddf6e9}.t-dragon{--a:#d9a21b;--b:#fff3c8}.t-friends{--a:#f2685a;--b:#ffe3df}
.t-office{--a:#8a6cf0;--b:#ece6ff}.t-booth{--a:#e2468a;--b:#ffdcec}.t-movie{--a:#c83c5a;--b:#ffe0e6}.t-travel{--a:#3c8ce0;--b:#e0efff}

/* ---------- tiến độ ---------- */
.progress{display:flex;align-items:center;gap:16px}
.ringp{position:relative;width:96px;height:96px;flex:none}
.ringp svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringp b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:24px;line-height:1}
.ringp b small{display:block;font-size:12px;font-family:var(--body);font-weight:600;color:var(--ink-soft);text-align:center}
.progress h2{font-size:22px}
.progress p{margin:4px 0 0;font-size:14.5px}
.bar{height:12px;border-radius:99px;background:#fbe8ef;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--pink));transition:width .8s var(--ease)}
.together{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:16px;background:#fff0f5;font-size:14.5px}
.together b{font-family:var(--display);font-size:22px;color:var(--pink)}

/* ---------- danh sách (vé) ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.tickets{display:grid;gap:12px}
.ticket{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-radius:20px;

const CLOUD = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);

const Cloud = (() => {
  if(!CLOUD) return null;
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth:{ flowType:'pkce', persistSession:true, detectSessionInUrl:true } });
  const ok = ({ data, error }) => { if(error) throw error; return data; };
  const BUCKET = 'memories';
  return {
    async user(){ const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    onAuth(fn){ sb.auth.onAuthStateChange((_e, s) => fn(s?.user || null)); },
    signIn(){ return sb.auth.signInWithOAuth({ provider:'facebook', options:{ redirectTo: location.origin + location.pathname } }); },
    // đăng nhập bằng mã gửi qua email (dành cho người không dùng được Facebook)
    async sendCode(email){ const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true, emailRedirectTo: location.origin + location.pathname } }); if(error) throw error; },
    async verifyCode(email, token){ const { data, error } = await sb.auth.verifyOtp({ email, token, type:'email' }); if(error) throw error; return data.user; },
    signOut(){ return sb.auth.signOut(); },
    async isMember(uid){ return ok(await sb.from('members').select('user_id,display_name').eq('user_id', uid).maybeSingle()); },
    async items(){ return ok(await sb.from('items').select('*').order('position').order('created_at')); },
    async addItem(row){ return ok(await sb.from('items').insert(row).select().single()); },
    async updateItem(id, patch){ return ok(await sb.from('items').update(patch).eq('id', id).select().single()); },
    async deleteItem(id){ ok(await sb.from('items').delete().eq('id', id)); },
    async memories(){ return ok(await sb.from('memories').select('*').order('taken_on', { ascending:false }).order('created_at', { ascending:false })); },
    async addMemory(m, uid){
      const id = crypto.randomUUID(), base = `${uid}/${id}`;
      ok(await sb.storage.from(BUCKET).upload(`${base}.jpg`, m.full, { contentType:'image/jpeg' }));
      ok(await sb.storage.from(BUCKET).upload(`${base}_t.jpg`, m.thumb, { contentType:'image/jpeg' }));
      return ok(await sb.from('memories').insert({ id, item_id:m.item_id, caption:m.caption, taken_on:m.taken_on, width:m.w, height:m.h,
        photo_path:`${base}.jpg`, thumb_path:`${base}_t.jpg`, created_by_name:m.by }).select().single());
    },
    async deleteMemory(m){ await sb.storage.from(BUCKET).remove([m.photo_path, m.thumb_path]); ok(await sb.from('memories').delete().eq('id', m.id)); },
    async urls(paths){
      const out = {}; if(!paths.length) return out;
      for(let i = 0; i < paths.length; i += 100){
        const data = ok(await sb.storage.from(BUCKET).createSignedUrls(paths.slice(i, i+100), 60*60*6));
        data.forEach(d => { if(d.signedUrl) out[d.path] = d.signedUrl; });
      }
      return out;
    }
  };
})();

function carousel(cards){

  return `<div class="stage3d" data-carousel><div class="floor"></div><div class="heart3d" style="color:var(--pink)">${ICON.heart}</div>
    <div class="ring" style="--r:${r}px">${cards.map((c, i) => `<div class="slot" style="transform:rotateY(${i*360/n}deg) translateZ(${r}px)">${c}</div>`).join('')}</div></div>`;

function bindCarousel(root){
  root.querySelectorAll('[data-carousel]').forEach(stage => {
    const ring = stage.querySelector('.ring'); let a = 0, v = reduce ? 0 : .12, drag = null, last = 0, alive = true;
    const tick = t => { if(!stage.isConnected){ alive = false; return; } const dt = Math.min(48, t - (last || t)); last = t;
      if(!drag){ a += v * dt / 16; v += ((reduce ? 0 : .12) - v) * .02; }
      ring.style.transform = `rotateX(-8deg) rotateY(${a}deg)`; requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    stage.addEventListener('pointerdown', e => { drag = { x:e.clientX, a, t:performance.now(), moved:false }; });
    addEventListener('pointermove', e => { if(!drag) return; const dx = e.clientX - drag.x; if(Math.abs(dx) > 6) drag.moved = true; const na = drag.a + dx * .4; v = (na - a) * .6; a = na; });
    addEventListener('pointerup', () => { if(drag){ stage.dataset.moved = drag.moved ? '1' : ''; drag = null; } });
  });
}
function bindTilt(root){
  root.querySelectorAll('[data-tilt],.ticket').forEach(el => {
    el.addEventListener('pointermove', e => { if(e.pointerType === 'touch' && !e.isPrimary) return; const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.setProperty('--ry', (x*14).toFixed(1)+'deg'); el.style.setProperty('--rx', (-y*12).toFixed(1)+'deg'); });
    el.addEventListener('pointerleave', () => { el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); });
  });
}

/* ============================ HIỆU ỨNG TIM BAY ============================ */
const FX = (() => {
  const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [], run = false;
  const COL = ['#ff6f9f','#ffb59c','#ffe08a','#8fe0c0','#9fd2ff','#c4b2ff'];
  function size(){ const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth*d; cv.height = innerHeight*d; cx.setTransform(d,0,0,d,0,0); }
  addEventListener('resize', size); size();
  function heart(x, y, s){ cx.beginPath(); cx.moveTo(x, y + s*.3); cx.bezierCurveTo(x, y, x - s*.5, y, x - s*.5, y + s*.3); cx.bezierCurveTo(x - s*.5, y + s*.6, x, y + s*.8, x, y + s);
    cx.bezierCurveTo(x, y + s*.8, x + s*.5, y + s*.6, x + s*.5, y + s*.3); cx.bezierCurveTo(x + s*.5, y, x, y, x, y + s*.3); cx.fill(); }
  function loop(){ cx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => { p.vy += .25; p.x += p.vx; p.y += p.vy; p.life--; cx.globalAlpha = Math.max(0, Math.min(1, p.life / 30)); cx.fillStyle = p.c; heart(p.x, p.y, p.s); });
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    if(parts.length) requestAnimationFrame(loop); else { run = false; cx.clearRect(0, 0, innerWidth, innerHeight); } }
  return { burst(x = innerWidth/2, y = innerHeight/2, n = 50){ if(reduce) return;
    for(let i = 0; i < n; i++) parts.push({ x, y, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, s:8+Math.random()*12, c:COL[i % COL.length], life:70+Math.random()*30 });
    if(!run){ run = true; requestAnimationFrame(loop); } } };
})();

function nextMonthiversary(){
  const s = new Date(CONFIG.TOGETHER_SINCE + 'T00:00:00'), t = new Date(today() + 'T00:00:00');
  for(let n = 1; n < 1200; n++){
    const d = new Date(s.getFullYear(), s.getMonth() + n, 1);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

  }
}

/* ================================ ĐIỀU HƯỚNG ================================ */
function route(){
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', id: parts[1], q: new URLSearchParams(qs || '') };
}
function render(){
  const app = $('#app'), r = route();
  $('#tabbar').hidden = !S.user || !S.member;
  if(!S.user){ app.innerHTML = viewLogin(); $('#loginBtn').onclick = () => API.signIn().catch(e => toast('Chưa đăng nhập được: ' + e.message)); $('#emailLogin').onclick = emailLogin; bindCarousel(app); bindTilt(app); return; }
  if(!S.member){ app.innerHTML = viewNotMember(); $('#logoutBtn').onclick = logout; return; }
  if(r.name === 'list' && r.q.get('f')) S.filter = r.q.get('f');
  const views = { home:viewHome, list:viewList, item:() => viewItem(r.id), memories:viewMemories, me:viewMe };
  app.innerHTML = (views[r.name] || viewHome)();
  document.querySelectorAll('#tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === (r.name === 'item' ? 'list' : r.name)));
  bindCarousel(app); bindTilt(app); bindView(app, r); startClock();
}
function bindView(app, r){
  app.querySelectorAll('[data-check]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); const it = itemById(b.dataset.check); it.done_at ? undoDone(it) : markDone(it); }));
  app.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { S.filter = b.dataset.filter; history.replaceState(null, '', '#/list'); render(); }));
  app.querySelectorAll('[data-mem]').forEach(el => el.addEventListener('click', () => { const st = el.closest('[data-carousel]'); if(st?.dataset.moved) return; openMemory(el.dataset.mem); }));
  $('#addItem')?.addEventListener('click', () => itemForm());
  $('#logoutBtn')?.addEventListener('click', logout);
  if(r.name === 'item'){
    const it = itemById(r.id); if(!it) return;
    $('#markDone')?.addEventListener('click', () => markDone(it));
    $('#undoDone')?.addEventListener('click', () => undoDone(it));
    $('#addPhoto')?.addEventListener('click', () => uploadSheet(it.id));
    app.querySelectorAll('[data-add]').forEach(el => el.addEventListener('click', () => uploadSheet(it.id)));
    $('#editItem')?.addEventListener('click', () => itemForm(it));
  }
}

  });

function uploadSheet(itemId){
  const files = [];
  openSheet(`<h2>Cất thêm kỷ niệm</h2>
    <div class="drop" id="drop">${ICON.camera}<b>Chọn ảnh trong máy</b><span class="muted" style="font-size:13px">Chọn được nhiều ảnh cùng lúc, trang sẽ tự thu nhỏ cho nhẹ.</span></div>

    <label class="field"><span>Đôi dòng trên ảnh</span><input type="text" id="uCap" maxlength="80" placeholder="Ví dụ: Hôm đó trời mưa mà vui ghê"></label>
    <label class="chk-line" id="uDoneLine" hidden><input type="checkbox" id="uDone" checked> Đánh dấu lời hẹn này đã làm được</label>
    <p class="progress-up" id="uProg" hidden></p>
    <button class="btn block" id="uGo" type="button" disabled>Cất vào sổ</button>
    <button class="btn ghost block" data-close type="button">Huỷ</button>`, (sh, close) => {
    const pick = $('#filePick'), pv = sh.querySelector('#pv'), sel = sh.querySelector('#uItem'), go = sh.querySelector('#uGo');
    const syncDone = () => { const it = itemById(sel.value); sh.querySelector('#uDoneLine').hidden = !it || !!it.done_at; draw(); };
    function draw(){
      const it = itemById(sel.value), th = theme(it?.theme);
      pv.innerHTML = files.map((f, i) => `<div style="position:relative">${polaroid(null, { theme:th, label:sh.querySelector('#uCap').value || it?.title || 'Kỷ niệm', mini:true, tilt:false })

      pv.querySelectorAll('.ph-empty').forEach(x => x.remove());
      pv.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { URL.revokeObjectURL(files[+b.dataset.rm].url); files.splice(+b.dataset.rm, 1); draw(); });
      go.disabled = !files.length; go.textContent = files.length > 1 ? `Cất ${files.length} tấm vào sổ` : 'Cất vào sổ';
    }
    const choose = () => { pick.value = ''; pick.click(); };
    sh.querySelector('#drop').onclick = choose;
    pick.onchange = () => { const add = [...pick.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
      if(add.length && !files.length) sh.querySelector('#uDate').value = fileDate(add[0]) > today() ? today() : fileDate(add[0]);
      add.forEach(f => files.push({ f, url:URL.createObjectURL(f) })); draw(); };
    sel.onchange = syncDone; sh.querySelector('#uCap').oninput = draw; syncDone();
    if(!itemId) choose();
    go.onclick = async () => {
      go.disabled = true; const prog = sh.querySelector('#uProg'); prog.hidden = false;
      const item_id = sel.value || null, taken_on = sh.querySelector('#uDate').value || today(), caption = sh.querySelector('#uCap').value.trim();
      try{
        for(let i = 0; i < files.length; i++){
          prog.textContent = `Đang thu nhỏ và tải tấm ${i+1}/${files.length}…`;
          const full = await compress(files[i].f, CONFIG.PHOTO_MAX), thumb = await compress(files[i].f, CONFIG.THUMB_MAX);
          await API.addMemory({ full:full.blob, thumb:thumb.blob, w:full.w, h:full.h, item_id, taken_on, caption, by:meName() }, S.user.id);
        }
        const it = itemById(item_id);
        if(it && !it.done_at && sh.querySelector('#uDone').checked) await API.updateItem(it.id, { done_at:taken_on, done_by:CLOUD ? S.user.id : undefined });
        files.forEach(x => URL.revokeObjectURL(x.url)); close(); await refresh();
        FX.burst(innerWidth/2, innerHeight*.6, 60); toast(files.length > 1 ? `Đã cất ${files.length} tấm ảnh vào sổ.` : 'Đã cất tấm ảnh vào sổ.');
      }catch(e){ go.disabled = false; prog.textContent = 'Tải ảnh chưa được: ' + e.message; }
    };
  });
}

function openMemory(id){
  const m = S.memories.find(x => x.id === id); if(!m) return;
  const it = itemById(m.item_id);
  const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');
  lb.innerHTML = `<div class="lb-inner"><div class="flipper" id="flp"><div class="flip-in">
      <div class="front">${polaroid(m, { full:true, rot:0, tilt:false })}</div>
      <div class="backside"><p class="note">${esc(m.caption || 'Không có ghi chú, chỉ có hai đứa.')}</p>
        <dl><dt>Ngày</dt><dd>${fmt(m.taken_on)}</dd>${it ? `<dt>Lời hẹn</dt><dd>${esc(it.title)}</dd>` : ''}${m.created_by_name ? `<dt>Người cất</dt><dd>${esc(m.created_by_name)}</dd>` : ''}</dl></div></div></div>
    <div class="lb-actions"><button class="btn small" id="lbFlip" type="button">Lật mặt sau</button>${it ? `<a class="btn ghost small" href="#/item/${it.id}" id="lbGo">Xem "${esc(it.title.length > 22 ? it.title.slice(0,22)+'…' : it.title)}"</a>` : ''}
      <button class="btn ghost small" id="lbDel" type="button">Xoá ảnh</button><button class="btn ghost small" id="lbClose" type="button">Đóng</button></div></div>`;
  document.body.appendChild(lb); requestAnimationFrame(() => lb.classList.add('on'));
  const close = () => { lb.classList.remove('on'); setTimeout(() => lb.remove(), 250); };
  lb.addEventListener('click', e => { if(e.target === lb) close(); });
  lb.querySelector('#lbClose').onclick = close;
  lb.querySelector('#lbGo')?.addEventListener('click', close);
  const flp = lb.querySelector('#flp');
  lb.querySelector('#lbFlip').onclick = () => { flp.classList.toggle('flipped'); lb.querySelector('#lbFlip').textContent = flp.classList.contains('flipped') ? 'Xem ảnh' : 'Lật mặt sau'; };
  flp.onclick = () => lb.querySelector('#lbFlip').click();
  let armed = false;
  lb.querySelector('#lbDel').onclick = async e => {
    if(!armed){ armed = true; e.target.textContent = 'Chạm lần nữa để xoá'; return; }
    try{ await API.deleteMemory(m); close(); await refresh(); toast('Đã xoá ảnh.'); }catch(err){ toast('Chưa xoá được: ' + err.message); }
  };
}

/* ================================= KHỞI ĐỘNG ================================= */
$('#fab').addEventListener('click', () => uploadSheet(route().name === 'item' ? route().id : ''));
addEventListener('hashchange', () => { if(S.user) { render(); scrollTo(0, 0); } });
async function boot(){
  if(!API){ $('#app').innerHTML = `<section class="login"><div class="empty">${THEMES.heart.icon}<h2>Chưa mở được cuốn sổ</h2><p class="muted">Mạng đang chập chờn. Tải lại trang thử nhé.</p><button class="btn" type="button" onclick="location.reload()">Tải lại</button></div></section>`; return; }
  try{
    S.user = await API.user();
    if(S.user){
      const row = await API.isMember(S.user.id);
      S.member = !!row; S.nick = row?.display_name || '';
      if(S.member) await loadAll();
    }
  }catch(e){ toast('Không tải được dữ liệu: ' + e.message); }
  render();
}
API?.onAuth(u => { if((u?.id || null) !== (S.user?.id || null)) boot(); });
boot();
</script>
